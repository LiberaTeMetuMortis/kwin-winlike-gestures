#
# Builds and tests against the newest KWin in openSUSE Tumbleweed. The weekly
# run catches Plasma updates that change KWin's internal API.
name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  tumbleweed:
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    steps:
      - name: Install dependencies
        run: |
          zypper --non-interactive refresh
          # The container image and the repo mirror can be from different
          # snapshots (e.g. image with libglib 2.90, repo glib2-devel still 2.88);
          # dup first so the installed packages match the repo, downgrading if needed.
          zypper --non-interactive dup --allow-vendor-change
          zypper --non-interactive install --no-recommends \
            git tar gzip cmake gcc-c++ kf6-extra-cmake-modules kwin6-devel \
            qt6-base-private-devel qt6-declarative-devel qt6-dbus-devel qt6-test-devel \
            kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kwindowsystem-devel \
            kf6-kcmutils-devel kf6-ki18n-devel \
            'pkgconfig(epoxy)' 'pkgconfig(libdrm)' 'pkgconfig(vulkan)' 'pkgconfig(wayland-server)' 'pkgconfig(xkbcommon)'

      - uses: actions/checkout@v4

      - name: KWin version
        # kwin6-devel pulls in libkwin6, not the kwin6 compositor package.
        run: rpm -q kwin6-devel libkwin6

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install (into a staging dir)
        run: DESTDIR="$PWD/stage" cmake --install build

  # Release: pushing a vX.Y.Z tag (release.sh does this) that passes the build
  # above tells OBS to fetch main, take the version from the tag and the spec
  # and .changes from the repo, and rebuild the package. Needs the OBS_TOKEN secret
  # (osc token --create --operation runservice home:MetuMortis kwin-winlike-gestures).
  obs-release:
    needs: tumbleweed
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is the tip of main
        # OBS builds main and names it after the newest tag, so they must match.
        run: |
          git fetch origin main
          tag_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          main_commit=$(git rev-parse origin/main)
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($tag_commit) is not the tip of main ($main_commit). Push main first, then tag its newest commit."
            exit 1
          fi

      - name: Trigger OBS
        env:
          OBS_TOKEN: ${{ secrets.OBS_TOKEN }}
        run: |
          if [ -z "$OBS_TOKEN" ]; then
            echo "::error::The OBS_TOKEN secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Token $OBS_TOKEN" \
            "https://api.opensuse.org/trigger/runservice?project=home:MetuMortis&package=kwin-winlike-gestures"
